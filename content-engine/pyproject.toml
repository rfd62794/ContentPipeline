[project]
name = "content-engine"
version = "0.1.0"
description = "ContentEngine — Python Content Pipeline"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "pywin32>=306",
    "psutil>=6.0",
    "pytest>=8.0",
    "yt-dlp",
    "googlesearch-python>=1.3.0",
    "openai-whisper",
    "sounddevice>=0.4.6",
    "scipy>=1.10.0",
    "google-auth>=2.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=0.5.0",
    "mcp>=1.0.0",
    "obs-websocket-py>=1.0.0",
    "obsws-python>=1.8.0",
    "edge-tts>=6.1.0",
    "pytest-asyncio>=0.21.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchvision>=0.15.0",
    # CUDA 12.1 versions for GPU support
    # torch==2.5.1+cu121
    # torchaudio==2.5.1+cu121
    # torchvision==0.20.1+cu121
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.21.0",
]

[dependency-groups]
dev = []
