<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRB</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --primary: #00ff41;
            --secondary: #00cc33;
            --dark-green: #003300;
            --text: #e0e0e0;
            --font: 'Courier New', Courier, monospace;
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: var(--font);
            color: var(--text);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        .brb-text {
            color: var(--primary);
            font-size: 5rem;
            margin: 0 0 2rem 0;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .cursor {
            display: inline-block;
            width: 0.5em;
            height: 1em;
            background: var(--primary);
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .subtext {
            color: var(--text);
            font-size: 1.5rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brb-text">> BRB<span class="cursor"></span></div>
        <p class="subtext">back in a moment</p>
    </div>
</body>
</html>
